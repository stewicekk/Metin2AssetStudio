name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Notify no deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "No RENDER_DEPLOY_HOOK_URL secret set — skipping Render deploy."
          echo "Set it in repo Settings → Secrets and variables → Actions."
          echo "Get the hook URL from Render Dashboard → Your Service → Deploy Hooks."
