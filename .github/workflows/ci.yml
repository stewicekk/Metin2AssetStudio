name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install server deps
        run: cd server && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc -b

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Run tests
        run: cd frontend && npm test

      - name: Verify server
        run: cd server && node -e "require('express')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/

  electron-build:
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            build-command: cd electron && npm run build:win
            artifact-name: windows-installer
            artifact-path: electron/dist-electron/*.exe
          - os: ubuntu-latest
            build-command: cd electron && npm run build:linux
            artifact-name: linux-appimage
            artifact-path: electron/dist-electron/*.AppImage
          - os: macos-latest
            build-command: cd electron && npm run build:mac
            artifact-name: macos-dmg
            artifact-path: electron/dist-electron/*.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install electron deps
        run: cd electron && npm ci

      - name: Build ${{ matrix.os }} installer
        run: ${{ matrix.build-command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || '' }}

      - name: Upload ${{ matrix.os }} installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

  release:
    needs: electron-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Metin2 Asset Studio v${{ github.run_number }}

            ### Downloads
            - [Windows Installer](./windows-installer)
            - [Linux AppImage](./linux-appimage)
            - [macOS DMG](./macos-dmg)

            ### Changes
            See the commit history for details.
          files: |
            artifacts/windows-installer/*
            artifacts/linux-appimage/*
            artifacts/macos-dmg/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
